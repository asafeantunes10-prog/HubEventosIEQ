<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      O icone e o "A" da logo "Avante & Sem Parar" (a logo inteira e larga demais para 16px).
      Os nomes mudaram de `favicon-*` para `icone-*` de proposito: o navegador guarda o
      icone da aba em cache por muito tempo, e um arquivo com o mesmo nome continuaria
      mostrando o antigo. O `favicon.ico` e para quem o pede por conta propria.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icone-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" href="/icone-apple.png" />

    <title>Fotos dos Eventos — IEQ</title>
    <meta
      name="description"
      content="As fotos dos eventos da igreja, reunidas num lugar so. Sem conta, sem pedido de permissao: e so abrir, ver e baixar."
    />

    <!--
      Valores genericos de propósito. A Pages Function em `functions/_middleware.ts`
      reescreve estas tres tags por evento (titulo, descricao e a capa) antes de a
      pagina sair do servidor — sem isso, todo link colado no Instagram e no
      WhatsApp apareceria com o mesmo texto e sem imagem, e e justamente por ali
      que as pessoas chegam.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fotos dos Eventos — IEQ" />
    <meta property="og:title" content="Fotos dos Eventos — IEQ" />
    <meta
      property="og:description"
      content="As fotos dos eventos da igreja, reunidas num lugar so. Sem conta, sem pedido de permissao: e so abrir, ver e baixar."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#140f4d" />

    <!-- Evita o clarao branco antes de o CSS chegar (a pagina inteira e escura). -->
    <style>
      html {
        background: #140f4d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
