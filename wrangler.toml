# Recursos da Cloudflare deste projeto.
#
# So D1 e Pages, e isso e deliberado: nenhum servico usado aqui pede cartao de
# credito. O R2 pede, mesmo no plano gratuito, e por isso esta fora — as fotos
# sao arquivos estaticos publicados junto com o site. Se alguma solucao futura
# parecer pedir "so cadastrar um cartao", e o caminho errado.
#
# Tudo com nome proprio e conta propria. Nada e reaproveitado de outro projeto:
# se um recurso compartilhado fosse apagado la, este site cairia junto.
#
# O `database_id` saiu do `wrangler d1 create`. Nao e segredo, e um
# identificador publico — pode ir para o git sem problema.
#
# O `binding` e o nome pelo qual o codigo enxerga o banco (`env.BANCO`). O
# wrangler sugere um nome derivado do banco; "BANCO" foi escolhido por ser mais
# legivel no meio de uma Function.

# O projeto Pages, e o endereco publico: eventos-ieq.pages.dev. Nao bate com o
# nome do banco logo abaixo, e tudo bem: renomear um projeto Pages custaria o
# endereco, que e justamente o que vai ser divulgado.
name = "eventos-ieq"
compatibility_date = "2026-08-20"
pages_build_output_dir = "dist"

# Os metadados dos eventos e das fotos. Ver `migrations/`.
#
# As IMAGENS nao passam por aqui nem por Function nenhuma: moram num SEGUNDO
# projeto Pages (`eventos-ieq-fotos`), so de arquivos estaticos, onde requisicao
# e gratis e ilimitada. As Functions so o ATUALIZAM, pela API do Cloudflare — ver
# `functions/lib/paginasApi.ts`.
[[d1_databases]]
binding = "BANCO"
database_name = "hub-eventos-ieq"
database_id = "dff2fae3-bac7-42bd-88c6-fbc43c8a2ddb"
migrations_dir = "migrations"

# Protecao do painel admin: NAO aparece aqui.
#
# A ideia original era Cloudflare Access, mas criar a equipe no Zero Trust
# pede cartao de credito mesmo no plano gratuito (confirmado na pratica) —
# mesmo motivo que tirou o R2 do projeto. A alternativa e uma senha unica, e
# as duas pecas que ela precisa (SENHA_HASH, SESSAO_SEGREDO) sao SECRETS, nao
# vars: configuradas por `wrangler pages secret put` e `scripts/gerar-senha.mjs`,
# nunca escritas neste arquivo nem versionadas. Ver `functions/api/admin/_middleware.ts`.

# O envio de fotos pelo painel tambem usa dois SECRETS (nunca escritos aqui):
#   CF_API_TOKEN    token da API com a permissao "Cloudflare Pages: Editar"
#   CF_ACCOUNT_ID   identificador da conta
# Sem eles, `/api/admin/armazenamento/*` responde 503. Como criar: README.md,
# secao "Configurar o envio de fotos". Para testar sem tocar na conta real, o
# `.dev.vars` aceita ainda `CF_API_BASE`, que aponta a API para um servidor local.
