# Recursos da Cloudflare deste projeto.
#
# So D1 e Pages, e isso e deliberado: nenhum servico usado aqui pede cartao de
# credito. O R2 pede, mesmo no plano gratuito, e por isso esta fora — as fotos
# sao arquivos estaticos publicados junto com o site. Se alguma solucao futura
# parecer pedir "so cadastrar um cartao", e o caminho errado.
#
# Tudo com nome proprio e conta propria. Nada e reaproveitado de outro projeto:
# se um recurso compartilhado fosse apagado la, este site cairia junto.
#
# O `database_id` fica vazio ate a conta existir: ele sai pronto do
# `wrangler d1 create` e e colado aqui. Nao e segredo, e um identificador
# publico — pode ir para o git sem problema.

name = "hub-eventos-ieq"
compatibility_date = "2026-08-20"
pages_build_output_dir = "dist"

# Os metadados dos eventos e das fotos. Ver `migrations/0001_inicial.sql`.
#
# As IMAGENS nao passam por aqui nem por Function nenhuma: elas sao servidas
# como assets estaticos em `/fotos/...`, onde requisicao e gratis e ilimitada.
[[d1_databases]]
binding = "BANCO"
database_name = "hub-eventos-ieq"
database_id = ""
migrations_dir = "migrations"
